<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dashboard · Control de Flota</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/static/base.css">
<script src="/static/chart.umd.min.js"></script>
<style>
h1{font-size:1.45rem;font-weight:800}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:12px}
.card h2{font-size:1rem;margin-bottom:8px}
.chart{position:relative;height:280px}
.delta{font:600 .8rem var(--f-mono)}
.up{color:var(--ok)} .down{color:var(--mt)}
.heat{border-collapse:separate;border-spacing:2px;width:auto}
.heat th,.heat td{padding:0;border:0;font:500 .7rem var(--f-mono);text-align:center}
.heat th{position:static;background:none;color:var(--muted);text-transform:none;letter-spacing:0;padding:0 2px;writing-mode:vertical-rl;transform:rotate(180deg);height:46px}
.heat th.b{writing-mode:horizontal-tb;transform:none;text-align:right;height:auto;padding-right:6px;position:sticky;left:0;background:var(--surface);z-index:1}
.heat td.c{width:22px;height:20px;border-radius:4px;font-weight:700}
.heat td.o{background:var(--ok-bg);color:var(--ok)} .heat td.m{background:var(--mt);color:#fff} .heat td.n{background:var(--surface2)}
.heat td.d{font-weight:700;padding-left:6px;text-align:left}
.down-row{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:flex-end;justify-content:space-between}
</style>
</head>
<body>
<div class="wrap">
  <h1>Dashboard y descarga</h1>

  <section class="card pad down-row">
    <div class="row">
      <label class="f">Desde<input type="date" id="desde"></label>
      <label class="f">Hasta<input type="date" id="hasta"></label>
      <button class="btn sec" id="aplicar">Actualizar</button>
    </div>
    <div class="row">
      <a class="btn" id="d-xlsx" href="#">Descargar Excel</a>
      <a class="btn sec" id="d-csv" href="#">Descargar CSV</a>
    </div>
  </section>

  <div id="vacio" class="msg warn" hidden>No hay reportes en el rango elegido.</div>

  <!-- 1 · Foto del día -->
  <div id="v1" hidden style="display:flex;flex-direction:column;gap:12px">
    <div class="row"><label class="f">Día<select id="dia"></select></label></div>
    <div class="kpis" id="k1"></div>
    <div class="grid2">
      <section class="card pad"><h2>Buses por Terminal Real</h2><div class="chart"><canvas id="c-term"></canvas></div></section>
      <section class="card pad"><h2>Por tipo de bus</h2><div class="scroll" id="t-tipo"></div></section>
    </div>
    <section class="card pad"><h2>Buses en mantenimiento</h2><div class="scroll" id="t-mant"></div></section>
  </div>


</div>
<script src="/static/comun.js"></script>
<script>
const $ = id => document.getElementById(id);
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
let D, vista = "1", graficos = {};
const hoyISO = () => new Date(Date.now() - new Date().getTimezoneOffset() * 6e4).toISOString().slice(0, 10);

function enlaces() {
  const q = `?desde=${$("desde").value}&hasta=${$("hasta").value}`;
  $("d-xlsx").href = "/api/descarga.xlsx" + q; $("d-csv").href = "/api/descarga.csv" + q;
}
async function cargar() {
  enlaces();
  D = await api(`/api/dashboard?desde=${$("desde").value}&hasta=${$("hasta").value}`);
  // fila: [fecha, interno, placa, tipo, marca, terminal, estado, obs]
  D.fechas = [...new Set(D.filas.map(f => f[0]))].sort();
  D.porFecha = {};
  D.filas.forEach(f => (D.porFecha[f[0]] ||= []).push(f));
  $("dia").innerHTML = D.fechas.slice().reverse().map(f => `<option value="${f}">${diaSemana(f)} ${fmtFecha(f)}</option>`).join("");
  pintar();
}
// Etiquetas de datos: el valor dentro de cada segmento y el total al final de la barra apilada.
const etiquetas = {id: "etiquetas", afterDatasetsDraw(ch) {
  const {ctx} = ch, horiz = ch.options.indexAxis === "y", tot = [];
  ctx.save(); ctx.font = "700 12px " + css("--f-mono"); ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ch.data.datasets.forEach((ds, di) => {
    const meta = ch.getDatasetMeta(di); if (meta.hidden) return;
    meta.data.forEach((el, i) => {
      const v = ds.data[i]; tot[i] = (tot[i] || 0) + (v || 0);
      if (!v) return;
      const largo = horiz ? Math.abs(el.x - el.base) : Math.abs(el.base - el.y);
      if (largo < 16) return;
      const p = el.tooltipPosition(); ctx.fillStyle = "#fff";
      ctx.fillText(v, horiz ? (el.x + el.base) / 2 : p.x, horiz ? p.y : (el.y + el.base) / 2);
    });
  });
  const ult = ch.getDatasetMeta(ch.data.datasets.length - 1);
  ctx.fillStyle = css("--fg");
  ult.data.forEach((el, i) => { if (!tot[i]) return;
    if (horiz) { ctx.textAlign = "left"; ctx.fillText("Total " + tot[i], el.x + 6, el.y); }
    else { ctx.fillText(tot[i], el.x, el.y - 9); } });
  ctx.restore();
}};
function grafico(id, cfg) {
  if (cfg.type === "bar") { cfg.plugins = [etiquetas]; cfg.options.layout ||= {padding: {top: 18}}; }
  graficos[id]?.destroy();
  Chart.defaults.font.family = css("--f-display"); Chart.defaults.color = css("--muted"); Chart.defaults.borderColor = css("--line");
  graficos[id] = new Chart($(id), cfg);
}
const kpi = (t, v, s = "") => `<div class="kpi"><span>${t}</span><b>${v}</b>${s ? `<small>${s}</small>` : ""}</div>`;
const pct = (a, b) => b ? Math.round(a / b * 100) : 0;
const delta = (d, suf = "") => d === null ? "" : `<span class="delta ${d > 0 ? "up" : d < 0 ? "down" : ""}">${d > 0 ? "+" : ""}${d}${suf} vs día anterior</span>`;

function pintar() {
  $("vacio").hidden = D.fechas.length > 0;
  $("v1").hidden = !D.fechas.length; $("v1").style.display = D.fechas.length ? "flex" : "none";
  if (D.fechas.length) v1();
}

function v1() {
  const dia = $("dia").value || D.fechas.at(-1), fs = D.porFecha[dia] || [];
  const i = D.fechas.indexOf(dia), prev = i > 0 ? D.porFecha[D.fechas[i - 1]] : null;
  const op = fs.filter(f => f[6] === "Operativo").length, mt = fs.length - op;
  const pop = prev ? prev.filter(f => f[6] === "Operativo").length : null;
  $("k1").innerHTML = kpi("Buses reportados", fs.length) + kpi("Operativos", op, delta(prev ? op - pop : null)) +
    kpi("En mantenimiento", mt, delta(prev ? mt - (prev.length - pop) : null)) +
    kpi("Disponibilidad", pct(op, fs.length) + "%", delta(prev ? pct(op, fs.length) - pct(pop, prev.length) : null, " pts"));
  const T = D.terminales;
  grafico("c-term", {type: "bar", data: {labels: T, datasets: [
      {label: "Operativo", data: T.map(t => fs.filter(f => f[5] === t && f[6] === "Operativo").length), backgroundColor: css("--ok")},
      {label: "Mantenimiento", data: T.map(t => fs.filter(f => f[5] === t && f[6] === "Mantenimiento").length), backgroundColor: css("--mt")}]},
    options: {indexAxis: "y", maintainAspectRatio: false, layout: {padding: {right: 70}}, scales: {x: {stacked: true, ticks: {precision: 0}}, y: {stacked: true}}, plugins: {legend: {position: "bottom"}}}});
  const tipos = [...new Set(fs.map(f => f[3]))].sort();
  $("t-tipo").innerHTML = `<table><thead><tr><th>Tipo bus</th><th>Operativos</th><th>Mantenimiento</th><th>Total</th><th>Disponibilidad</th></tr></thead><tbody>` +
    tipos.map(t => { const g = fs.filter(f => f[3] === t), o = g.filter(f => f[6] === "Operativo").length;
      return `<tr><td><b>${esc(t)}</b></td><td class="mono">${o}</td><td class="mono">${g.length - o}</td><td class="mono">${g.length}</td><td><span class="pill ${pct(o, g.length) >= 50 ? "p-ok" : "p-mt"}">${pct(o, g.length)}%</span></td></tr>`; }).join("") + "</tbody></table>";
  const m = fs.filter(f => f[6] === "Mantenimiento");
  $("t-mant").innerHTML = m.length ? `<table><thead><tr><th>Interno</th><th>Placa</th><th>Tipo</th><th>Marca</th><th>Terminal Real</th><th>Observación</th></tr></thead><tbody>` +
    m.map(f => `<tr><td class="mono"><b>${esc(f[1])}</b></td><td class="mono">${esc(f[2])}</td><td>${esc(f[3])}</td><td>${esc(f[4])}</td><td>${esc(f[5])}</td><td>${esc(f[7])}</td></tr>`).join("") + "</tbody></table>"
    : '<p class="note">Ningún bus en mantenimiento este día.</p>';
}


$("dia").onchange = v1;
$("aplicar").onclick = () => cargar().catch(x => alert(x.message));
["desde", "hasta"].forEach(id => $(id).addEventListener("change", enlaces));
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => D && pintar());

(async () => {
  await barra("/dashboard");
  const h = hoyISO(), d = new Date(h + "T12:00:00"); d.setDate(d.getDate() - 29);
  $("hasta").value = h; $("desde").value = d.toISOString().slice(0, 10);
  try { await cargar(); } catch (x) { $("vacio").hidden = false; $("vacio").className = "msg err"; $("vacio").textContent = x.message; }
})();
</script>
</body>
</html>
