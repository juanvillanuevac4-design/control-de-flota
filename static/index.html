<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Reporte diario · Control de Flota</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/static/base.css">
<style>
.wrap.ancha{max-width:none;gap:10px;padding-block:10px 0}
.head{display:flex;gap:12px 24px;align-items:center;justify-content:space-between;flex-wrap:nowrap}
.head .tit{display:flex;flex-direction:column;flex:none}
.head h1{font-size:1.15rem;font-weight:800}
.head .fecha{font:600 .88rem var(--f-mono)}
.head #estado{flex:1 1 auto;padding:7px 12px;font-size:.84rem;min-width:0}
.head .row{flex:none}
.head label.f{flex-direction:row;align-items:center;gap:6px}
@media (max-width:900px){.head{flex-wrap:wrap}.head #estado{flex-basis:100%;order:3}.head .row{flex:1 1 100%}.head label.f{flex-direction:column;align-items:stretch}.head input{min-width:0 !important;width:100%}}
.tools{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;justify-content:space-between}
.tools.card.pad{padding:8px 12px}
.tools .row{align-items:center}
.invitado{background:var(--warn-bg);color:var(--warn);font-weight:700}
.sum{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.send{position:sticky;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);margin:0 -16px;padding:8px 16px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
@media (max-width:640px){.send{gap:6px}.send .btn{width:100%;justify-content:center}.send .row{width:100%}}
#guardado.pend{color:var(--warn);font-weight:700} #guardado.err{color:var(--mt);font-weight:700} #guardado.ok{color:var(--ok)}

#vC{display:flex;gap:10px;align-items:stretch}
.col{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;flex-basis:0;min-width:170px;min-height:calc(100vh - 250px)}
.col h3{font-size:clamp(.95rem,1vw,1.15rem);display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.col h3 small{font:500 .8rem var(--f-mono);color:var(--muted);white-space:nowrap}
.col .bar{height:6px;border-radius:3px;background:var(--mt-bg);overflow:hidden}
.col .bar i{display:block;height:100%;background:var(--ok)}
.col.destino{outline:2px dashed var(--accent);outline-offset:-2px;background:var(--accent-bg)}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(clamp(54px,4.2vw,84px),1fr));gap:clamp(4px,.4vw,8px);align-content:start;flex:1}
.chip{font:600 clamp(.8rem,.95vw,1.08rem) var(--f-mono);border-radius:7px;padding:clamp(5px,.55vw,11px) 0;text-align:center;cursor:grab;border:1px solid transparent;touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.chip.ok{background:var(--ok-bg);color:var(--ok)}
.chip.mt{background:var(--mt-bg);color:var(--mt)}
.chip.ch{border-color:var(--warn)}
.chip.pend{border-style:dashed;border-color:var(--accent)}
.chip.obs::after{content:"•";margin-left:3px}
.chip.arrastrando{opacity:.35}
.fantasma{position:fixed;z-index:50;pointer-events:none;transform:translate(-50%,-50%) scale(1.15);box-shadow:0 6px 18px rgb(0 0 0 / .25)}
@media (max-width:700px){#vC{flex-direction:column}.col{flex:none !important;min-height:0;min-width:0}}
#dlg form{display:flex;flex-direction:column;gap:10px;min-width:min(320px,calc(100vw - 72px))}
#dlg .hist{font-size:.8rem;color:var(--muted);margin:0}
</style>
</head>
<body>
<div class="wrap ancha">
  <section class="head">
    <div class="tit">
      <h1>Reporte diario de distribución</h1>
      <div class="fecha" id="fecha"></div>
    </div>
    <div id="estado" class="msg info" hidden></div>
    <div class="row">
      <label class="f">Encargado<input id="encargado" maxlength="120" style="min-width:220px"></label>
      <label class="f">Fecha<input type="date" id="sel-fecha"></label>
    </div>
  </section>

  <section class="card pad tools">
    <p class="note" id="desc" style="margin:0;flex:1 1 300px">Arrastra un bus a otra terminal para moverlo. Doble click cambia Operativo / Mantenimiento. Un click abre el detalle (motivo y observación). En celular: mantén presionado y arrastra. Cada cambio se guarda solo. Borde amarillo: cambió hoy; punto: tiene observación.</p>
    <div class="row">
      <input type="search" id="buscar" placeholder="Buscar interno o placa" aria-label="Buscar">
      <select id="f-tipo" aria-label="Tipo de bus"><option value="">Todos los tipos</option></select>
      <select id="f-estado" aria-label="Estado"><option value="">Todos los estados</option><option>Operativo</option><option>Mantenimiento</option></select>
    </div>
  </section>

  <div id="vC"></div>

  <div class="send">
    <div class="sum" id="sum"></div>
    <div class="row" style="align-items:center"><span class="note" id="guardado"></span><button class="btn" id="enviar">Guardar corrección</button></div>
  </div>
</div>

<dialog id="dlg"><form method="dialog">
  <h3 id="d-t"></h3><p class="note" id="d-s"></p>
  <label class="f">Terminal Real<select id="d-term"></select></label>
  <label class="f">Estado<select id="d-est"></select></label>
  <label class="f" id="l-mot" hidden>Motivo de mantenimiento<select id="d-mot"></select></label>
  <label class="f">Observación<input id="d-obs" maxlength="500"></label>
  <p class="hist" id="d-h"></p>
  <div class="row"><button class="btn" value="ok">Aplicar y guardar</button><button class="btn sec" value="cancel" formnovalidate>Cancelar</button></div>
</form></dialog>

<script src="/static/comun.js"></script>
<script>
let yo, datos, filas = [], guardado = {}, tGuardar, guardando = false, encargadoGuardado = "";
const $ = id => document.getElementById(id);
const CAMPOS = ["terminal_real", "operativo", "motivo", "observacion"];
const llave = f => CAMPOS.map(c => f[c] || "").join("|");
const opts = (lista, v) => lista.map(o => `<option ${o === v ? "selected" : ""}>${esc(o)}</option>`).join("");
const pendientes = () => filas.filter(f => guardado[f.interno] !== llave(f));
const invitado = () => yo && yo.rol === "invitado";

function aviso(texto, clase) { const e = $("estado"); e.hidden = false; e.className = "msg " + clase; e.textContent = texto; }

async function cargar(fecha) {
  datos = await api("/api/reporte" + (fecha ? "?fecha=" + fecha : ""));
  filas = datos.filas;
  guardado = Object.fromEntries(filas.map(f => [f.interno, llave(f)]));
  $("fecha").textContent = diaSemana(datos.fecha) + " " + fmtFecha(datos.fecha);
  $("sel-fecha").value = datos.fecha;
  const tipos = [...new Set(filas.map(f => f.tipo_bus))].sort();
  const t = $("f-tipo").value;
  $("f-tipo").innerHTML = '<option value="">Todos los tipos</option>' + tipos.map(x => `<option ${x === t ? "selected" : ""}>${esc(x)}</option>`).join("");
  $("encargado").value = datos.existe ? datos.reporte.encargado : yo.nombre;
  encargadoGuardado = datos.existe ? datos.reporte.encargado : "";
  mensajeEstado();
  pintar();
}

function mensajeEstado() {
  if (invitado()) return aviso("Perfil invitado: puedes probar todo, pero tus cambios no se guardan en la base de datos.", "warn invitado");
  if (datos.existe) {
    const r = datos.reporte;
    aviso(`Reporte iniciado a las ${r.hora} por ${r.encargado}` + (r.ultimo_cambio ? ` · último cambio ${r.ultimo_cambio}` : "") + ". Cada cambio se guarda automáticamente.", "ok");
  } else {
    aviso(datos.prellenado_desde
      ? `Datos tomados del ${diaSemana(datos.prellenado_desde)} ${fmtFecha(datos.prellenado_desde)}. Al primer cambio (o con Guardar corrección) se crea el reporte de este día.`
      : "Primer reporte: datos tomados del Excel. Al primer cambio se crea el reporte de este día.", "info");
  }
}

function visibles() {
  const q = $("buscar").value.trim().toUpperCase(), t = $("f-tipo").value, e = $("f-estado").value;
  return filas.filter(f => (!q || f.interno.includes(q) || f.placa.includes(q)) && (!t || f.tipo_bus === t) && (!e || f.operativo === e));
}

function resumen() {
  const op = filas.filter(f => f.operativo === "Operativo").length, mt = filas.length - op;
  $("sum").innerHTML = `<span class="pill p-info">${filas.length} buses</span><span class="pill p-ok"><i></i>${op} operativos</span><span class="pill p-mt"><i></i>${mt} en mantenimiento</span>`;
  const n = pendientes().length, g = $("guardado");
  if (guardando) { g.className = "note pend"; g.textContent = "Guardando…"; }
  else if (n) { g.className = "note pend"; g.textContent = `${n} cambio${n > 1 ? "s" : ""} por guardar`; }
  else if (!g.classList.contains("err") && !g.textContent.startsWith("Guardado")) {
    g.className = "note ok"; g.textContent = invitado() ? "Invitado: cambios solo en tu pantalla" : (datos.existe ? "Todo guardado" : "Sin cambios");
  }
}

function pintar() {
  const vs = visibles(), pend = new Set(pendientes().map(f => f.interno));
  $("vC").innerHTML = datos.terminales.map(t => {
    const g = vs.filter(f => f.terminal_real === t), op = g.filter(f => f.operativo === "Operativo").length;
    return `<section class="col" data-t="${esc(t)}" style="flex-grow:${Math.max(g.length, 8)}"><h3>${esc(t)} <small>${op}/${g.length} operativos</small></h3>
      <div class="bar"><i style="width:${g.length ? op / g.length * 100 : 0}%"></i></div>
      <div class="chips">${g.map(f => {
        const tip = [f.placa, f.tipo_bus, f.operativo === "Mantenimiento" && f.motivo ? "Motivo: " + f.motivo : "", f.observacion,
          f.cambio_ts && f.cambio_ts !== "local" ? `Cambió ${f.cambio_ts} (${f.cambio_por})` : ""].filter(Boolean).join(" · ");
        return `<button type="button" class="chip ${f.operativo === "Operativo" ? "ok" : "mt"} ${f.cambio_ts ? "ch" : ""} ${pend.has(f.interno) ? "pend" : ""} ${f.observacion ? "obs" : ""}" data-i="${esc(f.interno)}" title="${esc(tip)}">${esc(f.interno)}</button>`;
      }).join("") || '<span class="note">Sin buses</span>'}</div></section>`;
  }).join("");
  resumen();
}

// ---- Guardado automático: cada cambio se envía al servidor (solo los buses que cambiaron).
function cambiar(interno, valores) {
  const f = filas.find(x => x.interno === interno);
  Object.assign(f, valores);
  if (f.operativo !== "Mantenimiento") f.motivo = "";
  $("guardado").textContent = "";
  pintar();
  programarGuardado(150);
}
function programarGuardado(ms) { clearTimeout(tGuardar); tGuardar = setTimeout(guardar, ms); }

async function guardar(forzar) {
  if (guardando) return programarGuardado(400);
  const pend = pendientes(), enc = $("encargado").value.trim();
  if (!enc) { $("guardado").className = "note err"; $("guardado").textContent = "Escribe el nombre del encargado."; return; }
  if (!pend.length && forzar !== true && enc === encargadoGuardado) return resumen();
  if (invitado()) {
    pend.forEach(f => { guardado[f.interno] = llave(f); f.cambio_ts = "local"; f.cambio_por = yo.nombre; });
    pintar(); return;
  }
  guardando = true; resumen();
  const envio = pend.map(f => ({interno: f.interno, terminal_real: f.terminal_real, operativo: f.operativo, motivo: f.motivo, observacion: f.observacion}));
  const llaves = Object.fromEntries(pend.map(f => [f.interno, llave(f)]));
  try {
    const r = await api("/api/reporte", {fecha: datos.fecha, encargado: enc, filas: envio});
    Object.assign(guardado, llaves);
    pend.forEach(f => { if (llave(f) === llaves[f.interno]) { f.cambio_ts = r.hora; f.cambio_por = yo.nombre; } });
    encargadoGuardado = enc;
    if (!datos.existe) { datos.existe = true; datos.reporte = {hora: r.hora, encargado: enc}; }
    datos.reporte.ultimo_cambio = r.hora; datos.reporte.encargado = enc;
    mensajeEstado();
    $("guardado").className = "note ok"; $("guardado").textContent = `Guardado ${r.hora}`;
  } catch (x) {
    $("guardado").className = "note err"; $("guardado").textContent = "No se guardó: " + x.message;
  }
  guardando = false;
  pintar();
  if (pendientes().length && !$("guardado").classList.contains("err")) programarGuardado(800);
}
$("enviar").onclick = () => { $("guardado").textContent = ""; guardar(true); };
$("encargado").addEventListener("change", () => datos.existe && guardar());

// ---- Detalle (un click) y cambio de estado (doble click)
let editando, tClick, arrastre = null, sinClick = false;
function abrirDetalle(interno) {
  editando = filas.find(f => f.interno === interno);
  $("d-t").textContent = "Bus " + editando.interno;
  $("d-s").textContent = `${editando.placa} · ${editando.tipo_bus} · ${editando.tipo_flota} · ${editando.marca_chasis}`;
  $("d-term").innerHTML = opts(datos.terminales, editando.terminal_real);
  $("d-est").innerHTML = opts(datos.estados, editando.operativo);
  const mot = !editando.motivo || datos.motivos.includes(editando.motivo) ? datos.motivos : [editando.motivo, ...datos.motivos];
  $("d-mot").innerHTML = '<option value="">(sin motivo)</option>' + opts(mot, editando.motivo);
  $("l-mot").hidden = editando.operativo !== "Mantenimiento";
  $("d-obs").value = editando.observacion || "";
  $("d-h").textContent = editando.cambio_ts && editando.cambio_ts !== "local" ? `Último cambio: ${editando.cambio_ts} por ${editando.cambio_por}` : "";
  $("dlg").showModal();
}
$("d-est").onchange = () => { $("l-mot").hidden = $("d-est").value !== "Mantenimiento"; };
$("dlg").addEventListener("close", () => {
  if ($("dlg").returnValue !== "ok" || !editando) return;
  cambiar(editando.interno, {terminal_real: $("d-term").value, operativo: $("d-est").value,
    motivo: $("d-est").value === "Mantenimiento" ? $("d-mot").value : "", observacion: $("d-obs").value.trim()});
});
$("vC").addEventListener("click", e => {
  const b = e.target.closest(".chip");
  if (!b) return;
  if (sinClick) { sinClick = false; return; }
  clearTimeout(tClick);
  if (e.detail > 1) return;
  tClick = setTimeout(() => abrirDetalle(b.dataset.i), 260);
});
$("vC").addEventListener("dblclick", e => {
  const b = e.target.closest(".chip");
  if (!b) return;
  clearTimeout(tClick);
  const f = filas.find(x => x.interno === b.dataset.i);
  cambiar(f.interno, {operativo: f.operativo === "Operativo" ? "Mantenimiento" : "Operativo"});
});

// ---- Arrastrar: con mouse al mover; en pantalla táctil, manteniendo presionado medio segundo.
$("vC").addEventListener("pointerdown", e => {
  const b = e.target.closest(".chip");
  if (!b || e.button > 0) return;
  arrastre = {b, x: e.clientX, y: e.clientY, activo: false, tactil: e.pointerType !== "mouse"};
  if (arrastre.tactil) arrastre.t = setTimeout(() => iniciarArrastre(e.clientX, e.clientY), 450);
});
function iniciarArrastre(x, y) {
  if (!arrastre) return;
  arrastre.activo = true;
  clearTimeout(tClick);
  const g = arrastre.b.cloneNode(true);
  g.classList.add("fantasma"); g.style.left = x + "px"; g.style.top = y + "px";
  document.body.appendChild(g); arrastre.g = g;
  arrastre.b.classList.add("arrastrando");
  if (navigator.vibrate) navigator.vibrate(20);
}
function columnaEn(x, y) { const el = document.elementFromPoint(x, y); return el && el.closest("#vC .col"); }
document.addEventListener("pointermove", e => {
  if (!arrastre) return;
  const d = Math.hypot(e.clientX - arrastre.x, e.clientY - arrastre.y);
  if (!arrastre.activo) {
    if (arrastre.tactil) { if (d > 10) { clearTimeout(arrastre.t); arrastre = null; } return; }
    if (d < 6) return;
    iniciarArrastre(e.clientX, e.clientY);
  }
  arrastre.g.style.left = e.clientX + "px"; arrastre.g.style.top = e.clientY + "px";
  document.querySelectorAll("#vC .col.destino").forEach(c => c.classList.remove("destino"));
  const c = columnaEn(e.clientX, e.clientY);
  if (c) c.classList.add("destino");
});
document.addEventListener("touchmove", e => { if (arrastre && arrastre.activo) e.preventDefault(); }, {passive: false});
function terminarArrastre(e, soltar) {
  if (!arrastre) return;
  clearTimeout(arrastre.t);
  const a = arrastre; arrastre = null;
  if (!a.activo) return;
  sinClick = true; setTimeout(() => sinClick = false, 400);
  a.g.remove(); a.b.classList.remove("arrastrando");
  document.querySelectorAll("#vC .col.destino").forEach(c => c.classList.remove("destino"));
  const c = soltar && columnaEn(e.clientX, e.clientY);
  if (c && c.dataset.t) cambiar(a.b.dataset.i, {terminal_real: c.dataset.t});
}
document.addEventListener("pointerup", e => terminarArrastre(e, true));
document.addEventListener("pointercancel", e => terminarArrastre(e, false));
$("vC").addEventListener("contextmenu", e => { if (e.target.closest(".chip")) e.preventDefault(); });

["buscar", "f-tipo", "f-estado"].forEach(id => $(id).addEventListener("input", pintar));
$("sel-fecha").addEventListener("change", async e => {
  if (!e.target.value) return;
  if (pendientes().length && !invitado()) await guardar();
  cargar(e.target.value).catch(x => alert(x.message));
});
window.addEventListener("beforeunload", e => { if (!invitado() && (pendientes().length || guardando)) e.preventDefault(); });

// Trae los cambios de otros usuarios cada minuto, si no hay nada pendiente ni abierto.
setInterval(() => {
  if (!datos || invitado() || guardando || arrastre || $("dlg").open || pendientes().length || document.hidden) return;
  cargar(datos.fecha).catch(() => {});
}, 60000);

(async () => {
  try {
    yo = await barra("/");
    $("sel-fecha").max = new Date(Date.now() - new Date().getTimezoneOffset() * 6e4).toISOString().slice(0, 10);
    await cargar();
  } catch (x) { aviso(x.message, "err"); }
})();
</script>
</body>
</html>
